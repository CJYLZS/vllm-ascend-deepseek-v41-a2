# 补丁序列：按顺序应用（vllm-ascend 侧）
# 每行一个文件名，位于 patches/ 下；`#` 开头为注释。
#
# ★ 本文件按分支不同：v0300 分支起于 v0.30.0 基座（vllm-ascend c09d3e20b）。
#   main / v1 / v2 分支的对应文件挂在 v0.30.0rc2（8fde6d4e3）上，别混用。
#
# 分层原则（决定升级到新基线时**只需重做哪些**）：
#   0xxx  性能/功能优化，与上游深度耦合 —— 升基线时按下面的「上游 churn」逐个评估
#   1xxx  KV offload（外部池）相关修复 —— 只有挂 --kv-transfer-config 时才需要
#
# 上游 v0.30.0rc2(8fde6d4e3) → v0.30.0(c09d3e20b) 共 320 提交的实测 churn
# （2026-11-02 逐文件比对两镜像结果，非估算）：
#   envs.py                 0 提交  ← 逐字节相同（6 个 gate 仍不存在，0001 必须留）
#   dsa_v41.py              0 提交  ← 逐字节相同
#   model.py                0 提交  ← 逐字节相同
#   indexer.py              0 提交  ← 逐字节相同
#   engram/layer.py         0 提交  ← 逐字节相同
#   rope_dsv4.py            0 提交  ← 逐字节相同
#   token_dispatcher.py     0 提交  ← 逐字节相同
#   attention_v1.py         0 提交  ← 逐字节相同
#   packed_cache_slot_mapping.py  0 提交  ← 逐字节相同
#   dsa_v1.py             +11/-14   ← 全是上游自用重构，与 0003 无关（见下）
#   engram/npu.py            +11    ← madvise(MADV_HUGEPAGE)
#   vl_model.py               +5    ← PCP 嵌入转发
#   pool_scheduler.py      +44/-74  ← **吸收了我们原来的 0101**（见文件末尾）
#
# 注意：dsa_v1.py 在 V2 下**确实会被 import**
# （worker/v2/attn_utils.py:64 引 AscendDSAMetadataBuilder），
# 不能因为「V2 默认走 dsa_v41」就删掉 0003；但其改动由
# VLLM_ASCEND_V41_O_PROJ_2D 门控、默认关闭，所以升级时可**延后**处理。

# === 性能 / 功能（默认启用）===
0001-envs-gates.patch
0002-dsa-v41.patch
0003-dsa-v1-o-proj-2d.patch
0004-model-opts.patch
0005-packed-cache-slot-mapping-scalar.patch

# === KV offload（外部池；只有挂 AscendStoreConnector 时才需要）===
# ⚠ v0300 分支上**没有** 1xxx 条目 —— 0101 已退役，原因如下。
#
# 0101-kvpool-mrv2-resume.patch（本分支不再应用）
#   原用途：MRV2 抢占恢复后没清 _preempted_req_ids ⇒ 池 key 关联到错误的
#           block，命中即读到别人的 KV（静默算错，日志不报）。
#   现状：上游 commit 1b06b6cc6（PR #19567 "Fix MRV2 resume state and revert
#         save suppression"）已含**同样的 2 行**，在新树
#         vllm_ascend/distributed/kv_transfer/kv_pool/ascend_store/pool_scheduler.py:825：
#             if self.vllm_config.use_v2_model_runner:
#                 self._preempted_req_ids.discard(request.req_id)
#         在新树上 `git apply --check` 该补丁 ⇒ "patch does not apply"。
#   处理：退役，而不是重做。补丁文件保留在 patches/ 里（main 分支仍在用），
#         但**不写进本分支的 series.conf**。
#   连带影响（已核对）：上游同一个 PR 顺带 revert 了 #19533 的"保存抑制"workaround
#         （3dda2fc79），我们没有吃那个 workaround，所以两边一致、无额外风险。
#   闸门仍在：kv_offload.sh 的 kv_offload_require_tree_fix 判据是**那行代码在不在**，
#         不关心是谁写的 ⇒ 本分支挂池时它由上游代码满足，且将来上游改掉这行
#         它仍会在起服前拦住（这是保留该闸门的理由）。
