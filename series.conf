# 补丁序列：按顺序应用（vllm-ascend 侧）
# 每行一个文件名，位于 patches/ 下；`#` 开头为注释。
#
# 分层原则（决定升级到新基线时**只需重做哪些**）：
#   0xxx  性能/功能优化，与上游深度耦合 —— 升基线时按下面的「上游 churn」逐个评估
#   1xxx  KV offload（外部池）相关修复 —— 只有挂 --kv-transfer-config 时才需要
#
# 上游 v0.30.0rc2(8fde6d4e3) → main 452 提交的实测 churn（决定升级成本）：
#   dsa_v1.py            11 提交 +623/-159  ← 冲突重灾区，但改动默认关闭（见下）
#   dsa_v41.py            5 提交 +153/-4
#   model.py              7 提交  +46/-1
#   rope_dsv4.py          1 提交
#   engram/layer.py       0 提交  ← 零冲突
#   indexer.py            0 提交  ← 零冲突
#   token_dispatcher.py   0 提交  ← 零冲突
#
# 注意：dsa_v1.py 在 V2 下**确实会被 import**
# （worker/v2/attn_utils.py:64 引 AscendDSAMetadataBuilder），
# 不能因为「V2 默认走 dsa_v41」就删掉 0003；但其改动由
# VLLM_ASCEND_V41_O_PROJ_2D 门控、默认关闭，所以升级时可**延后**处理。

