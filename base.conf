# =============================================================================
# base.conf —— 本分支的**基座身份**（唯一来源）
#
# ★ 约定：**一个分支 = 一个基座**。换镜像就开新分支（v0300、v0310 …），
#   不要在现有分支上原地改这里的值。理由：
#     README「实测数据」里的每一行都依附基座身份（镜像 + 上游 commit + 工具链）。
#     原地改完再把旧数字留在同一张表里，读的人无法分辨哪些数还成立
#     —— 那就是"看起来有效、其实换了底"的假数据。原地覆盖还会连带毁掉
#     `tree/`（gitignored 单份产物），旧基座从此不可复现。
#
# ★ 换基座时**只改这一个文件 + series.conf + 两处文档**，三个起服入口
#   （本仓库 start-server.sh、工作区根 start-server.sh、rc2/serve.sh）
#   都从这里取值，不再各自写死镜像名与 python 版本号。
#
# 由 base.sh 读取解析；**不要直接 source 本文件**。
# 运行期可用同名环境变量覆盖（IMAGE=… 、SRC_DIR=… 、PGO_DEST=…）。
# =============================================================================

# ---- 镜像 -------------------------------------------------------------------
# 可用 IMAGE=... 覆盖；覆盖后必须自己保证源码树已用该镜像重建
# （工作区根 start-server.sh 会拿 .patches-applied 第 3 行硬拦，见它的 exit 9）。
BASE_IMAGE='quay.nju.edu.cn/ascend/vllm-ascend:v0.32.0rc1'
# 建树时的镜像 Id。写进 .patches-applied 第 3 行做交叉校验；
# base.sh 会与 `docker image inspect` 实测值比对，不一致就警告（tag 被重推的信号）。
BASE_IMAGE_ID='sha256:d5492ecfdb3071ff2d4bae3f849245014c54b63035d9eefb35243869461ddae1'

# ---- 上游身份 ---------------------------------------------------------------
# 镜像内 /vllm-workspace/ 下两棵树的 HEAD。仅用于文档与判"补丁还该不该在"。
BASE_UPSTREAM_COMMIT='24487f4f4'   # vllm-ascend 0.32.0rc1，2026-11-10（v0.30.0 是 c09d3e20b / 2026-10-29；相距 700 提交）
BASE_VLLM_COMMIT='5df63a7203'      # vllm 0.32.0，2026-10-17（v0.30.0 是 ced6857）。
                                   # ★ 这次 vllm 树**真的变了**（0.30→0.32 跨两个次版本），
                                   #   与 v0.30.0rc2↔v0.30.0 那次「两棵 vllm 逐字节相同」不同

# ---- 工具链（改基座时这三条几乎总要一起变）----------------------------------
BASE_CANN='9.2.1'                  # 与 v0.30.0 相同（9.2.0 只在 v0.30.0rc2 及更早）
BASE_PYTHON_VER='3.12.16'          # 与 v0.30.0 相同 ← PGO 挂载点就靠它
BASE_TRITON_ASCEND='3.6.0.post2'   # 与 v0.30.0 相同

# ---- 源码树产物目录（相对补丁仓库根）----------------------------------------
# 按分支分家，各基座的树才能**并存**（否则切分支就原地重建、把旧树覆盖掉）。
# tree/        ← v0.30.0rc2 基座（main 分支用）
# tree-v0300/  ← v0.30.0 基座（v0300 分支）
# tree-v0320/  ← 本分支（v0.32.0rc1 基座）
BASE_TREE_DIR='tree-v0320'

# ---- PGO 产物（按 python 版本分家，各基座互不覆盖）---------------------------
# 镜像自带的 libpython **不是** PGO 构建（两个镜像的 CONFIG_ARGS 里都没有
# --enable-optimizations / --with-lto，已核实），所以这项收益必须自己提供。
#
# 3.12.16 基座（v0300 起）用 **官方 PGO+LTO 预编译产物**，不再自己编：
#   astral-sh/python-build-standalone, release 20261026,
#   cpython-3.12.16+20261026-aarch64-unknown-linux-gnu-install_only.tar.gz
#   其 CONFIG_ARGS 含 --enable-optimizations + --with-lto=full + PROFILE_TASK=-m test --pgo，
#   是货真价实的 PGO+LTO 构建，且**版本与镜像精确一致**（3.12.16）。
#
# 为什么这比自编（约 1322 s）好：
#   ① 版本精确匹配，不再是"3.12.13 核心 + 3.12.16 标准库"的跨版本组合；
#   ② 只要求 GLIBC 2.17（自编产物要求 2.35），可移植性更好；
#   ③ 省掉一次 22 min 的编译与随后的产物校验。
# 代价：它用 clang + MODULE_BUILDTYPE=static 编（96 个内建模块 vs 镜像 31 个），
#   所以 .text 段 9.6 MB vs 镜像 2.5 MB。已实测：torch / torch_npu / vllm /
#   vllm_ascend / NPU matmul 全部正常，见 rc2/docs/PGO_31216.md。
BASE_PGO_SO_REL='../../pgo/optim/pgo-3.12.16/libpython3.12.so.1.0'
# 探测失败时的兜底落点（正常情况下用不到：base.sh 会起 0.7 s 的一次性容器探测
# 镜像内 sysconfig 的 LIBDIR，见 base_pgo_dest）。留个正确值总比静默挂错好。
BASE_PGO_DEST_HINT='/usr/local/python3.12.16/lib/libpython3.12.so.1.0'

# ---- PGO 产物的来源版本 -----------------------------------------------------
# 与 BASE_PYTHON_VER 相同 ⇒ 不再打印"跨版本挂载"提示。
# 但注意：PGO 的 −3.2~5.1% 是在 **3.12.13 自编产物**上量的；
# 这份 3.12.16 产物的实际增益**尚未在新基座上实测**，换基座后要重新量。
BASE_PGO_ARTIFACT_PYVER='3.12.16'
